name: amex-incident-investigator

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AMEX_API_HOST: 0.0.0.0
      AMEX_API_PORT: 8000
      AMEX_ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:3100","http://127.0.0.1:3100"]'
      AMEX_REDIS_URL: redis://redis:6379/0
      AMEX_POSTGRES_DSN: postgresql://amex:amex@postgres:5432/amex_incidents
      AMEX_SIMULATOR_URL: http://simulator:8010
      AMEX_COPILOT_PROVIDER: ${AMEX_COPILOT_PROVIDER:-disabled}
      AMEX_COPILOT_MODEL: ${AMEX_COPILOT_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${AMEX_API_HOST_PORT:-8100}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      simulator:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "uvicorn", "simulator.api:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      AMEX_SIMULATOR_HOST: 0.0.0.0
      AMEX_SIMULATOR_PORT: 8010
      AMEX_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "uvicorn", "backend.ingestion.app:app", "--host", "0.0.0.0", "--port", "8020"]
    environment:
      AMEX_INGESTION_HOST: 0.0.0.0
      AMEX_INGESTION_PORT: 8020
      AMEX_REDIS_URL: redis://redis:6379/0
      AMEX_POSTGRES_DSN: postgresql://amex:amex@postgres:5432/amex_incidents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AMEX_API_URL: http://localhost:${AMEX_API_HOST_PORT:-8100}/api/v1
        NEXT_PUBLIC_AMEX_DATA_MODE: live
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: amex_incidents
      POSTGRES_USER: amex
      POSTGRES_PASSWORD: amex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amex -d amex_incidents"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5m
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/persistence/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7.4.9-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --raw ping 2>/dev/null | grep -qx PONG"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5m
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
