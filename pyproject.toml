[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "amex-incident-investigator"
version = "0.1.0"
description = "Synthetic AI Payment Incident Investigator hackathon MVP"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.140.12",
  "httpx==0.27.1",
  "pydantic==2.13.2",
  "pydantic-settings==2.14.1",
  "psycopg[binary]==3.3.2",
  "redis==8.0.0",
  "uvicorn==0.52.2",
  "websockets==17.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "simulator"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["backend/tests", "tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
